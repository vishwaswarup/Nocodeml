[project]
name = "nocodeml-engine"
version = "0.1.0"
description = "NoCodeML Phase 1 core ML engine - deterministic dataset profiling, preprocessing, training, and evaluation."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.8",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "reportlab>=4.0",
    "pydantic>=2.0",
    "xgboost>=2.0",   # optional at runtime; on macOS it also needs `brew install libomp`
]

[project.optional-dependencies]
supabase = ["supabase>=2.0"]
api = ["supabase>=2.0", "fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9", "python-dotenv>=1.0"]
dev = [
    "pytest>=7.4",
    "pypdf>=4.0",
    "pymupdf>=1.24",
    "supabase>=2.0",
    "psycopg[binary]>=3.1",
    "fastapi>=0.110",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "uvicorn>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nocodeml_engine*"]
