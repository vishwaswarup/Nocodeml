[project]
name = "nocodeml-engine"
version = "0.1.0"
description = "NoCodeML Phase 1 core ML engine - deterministic dataset profiling, preprocessing, training, and evaluation."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nocodeml_engine*"]
